<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo_detail</title>
</head>
<body>
    <h1>{{ data.title }}</h1>
    <table>
        {% for key, value in data.items %}
            {% if key != 'title' %}
                <tr>
                    <th>{{ key }}</th>
                    <td>{{ value }}</td>
                </tr>
            {% endif %}
        {% endfor %}
    </table>
</body>
</html>
