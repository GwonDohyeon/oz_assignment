{% extends 'base.html' %}
{% block content %}
<h1>{{blog.title}}</h1>
    <div>
        작성자: {{blog.author.username}}
        {% if request.user == blog.author %}
        <a href="{% url 'blog_update' blog.pk %}">수정</a>
        <form method="POST" action="{% url 'blog_delete' blog.pk %}">
            {%csrf_token%}
            <button>삭제</button>
        </form>
        {% endif %}
    </div>
    <hr>
    <p>{{blog.content}}</p>
    <a href="{%url 'blog_list'%}">목록으로 돌아가기</a>
{% endblock %}
